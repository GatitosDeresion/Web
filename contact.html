<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Replica</title>
    <style>
        /* Estilo general */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fafafa;
        }

        /* Encabezado fijo */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #dbdbdb;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        header img {
            height: 30px;
        }

        header input {
            background: #efefef;
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 14px;
            outline: none;
        }

        header .icons {
            display: flex;
            gap: 15px;
        }

        header .icons img {
            height: 24px;
            cursor: pointer;
        }

        /* Contenedor principal */
        .container {
            margin: 80px auto; /* Espacio debajo del encabezado */
            max-width: 600px;
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Formulario */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, textarea, button {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #dbdbdb;
            border-radius: 5px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #3897f0;
        }

        button {
            background-color: #3897f0;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #3180d0;
        }

        /* Footer */
        footer {
            text-align: center;
            font-size: 12px;
            color: #8e8e8e;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Encabezado -->
    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram Logo">
        <input type="text" placeholder="Buscar">
        <div class="icons">
            <img src="https://img.icons8.com/ios/50/000000/home--v1.png" alt="Home">
            <img src="https://img.icons8.com/ios/50/000000/like--v1.png" alt="Like">
            <img src="https://img.icons8.com/ios/50/000000/user--v1.png" alt="Profile">
        </div>
    </header>

    <!-- Contenedor principal -->
    <div class="container">
        <h2>Formulario de Contacto</h2>
        <form id="contactForm">
            <input type="text" id="name" name="name" placeholder="Nombre completo" required>
            <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
            <textarea id="message" name="message" rows="4" placeholder="Escribe tu mensaje aquí" required></textarea>
            <button type="submit">Guardar y Enviar</button>
        </form>
        <p id="responseMessage" style="color: green; display: none;">¡Tu información ha sido enviada con éxito!</p>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2024 Instagram Replica - Solo para práctica personal.</p>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            // Simula envío de datos (para práctica)
            console.log("Datos enviados:", formData);
            document.getElementById('responseMessage').style.display = 'block';
        });
    </script>
</body>
</html>
